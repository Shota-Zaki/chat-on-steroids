name: 機能要望
description: Chat On Steroidsの具体的な改善案を提案します。
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        まず解決したいWorkflowや現在の制約を説明してください。
        常時公開する新しいMCP Toolの追加は慎重に判断します。既存Primitiveで解決できるWorkflowも多いため、最小の改善を優先します。

  - type: textarea
    id: problem
    attributes:
      label: 問題 / Workflow
      description: 何を実現したいか、現在どこで止まる・遅くなるかを説明してください。
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 提案する変更
      description: 問題を解決するための必要最小限の変更を説明してください。
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 検討した代替案
      description: 任意。試したWorkaroundや既存Tool / Workflowがあれば記載してください。

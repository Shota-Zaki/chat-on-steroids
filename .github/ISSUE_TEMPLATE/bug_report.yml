name: Bug報告
description: 想定と異なる動作や不具合を報告します。
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        報告ありがとうございます。このProjectは個人管理のBetaです。

        **Security上の問題の場合は、ここでPublic Issueを作成しないでください。**
        Repositoryの Security → Report a vulnerability からPrivate Reportしてください。

  - type: input
    id: version
    attributes:
      label: アプリVersion
      description: 設定画面などで確認できるVersionを入力してください。
      placeholder: "2.0.6"
    validations:
      required: true

  - type: input
    id: operating_system
    attributes:
      label: OSとVersion
      placeholder: "Windows 11 24H2、macOS 15.6、Ubuntu 24.04 など"
    validations:
      required: true

  - type: dropdown
    id: architecture
    attributes:
      label: Architecture
      options:
        - "x64 (Intel/AMD)"
        - "ARM64"
        - "不明"
    validations:
      required: true

  - type: dropdown
    id: extension
    attributes:
      label: Chrome拡張機能は接続されていましたか？
      options:
        - "はい。Versionもアプリと一致しています"
        - "はい。ただしVersion一致は未確認です"
        - "いいえ"
        - "Chrome拡張機能をInstallしていません"
    validations:
      required: true

  - type: dropdown
    id: chatgpt_access
    attributes:
      label: ChatGPT Workspace / Custom MCPの利用状況
      description: 最も近いものを選択してください。ChatGPTのPlanやWorkspace PolicyによりCustom Appの挙動が変わる場合があります。
      options:
        - "Business"
        - "Enterprise / Edu"
        - "Pro"
        - "その他 / 不明"
        - "このBugには関係ありません"
    validations:
      required: true

  - type: textarea
    id: what
    attributes:
      label: 発生したこと
      description: 実行した操作、実際に起きたこと、期待していた動作を記載してください。
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: 再現手順
      placeholder: |
        1.
        2.
        3.

  - type: textarea
    id: extra
    attributes:
      label: 補足
      description: >
        関係するLogや、その時点で有効だったPermission等を記載できます。
        Secret、個人ファイルの内容、User名 / Path、会話本文、Account / Workspace識別子は投稿前に削除してください。
      render: text
